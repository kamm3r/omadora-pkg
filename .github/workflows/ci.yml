name: CI

on:
  push:
    branches: [main, hyprland-testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fedora:
    name: Fedora 44 tests and core RPMs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: fedora:44
    defaults:
      run:
        shell: bash
    steps:
      - name: Install test dependencies
        run: >-
          dnf -y install git make python3 python3-rpm rpm-build
          systemd-rpm-macros cpio findutils diffutils tar gzip which

      - name: Check out package recipes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test release promotion gates
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

      - name: Test upstream reconciliation behavior
        run: python3 test/reconcile-test.py

      - name: Check AppImage packaging layout
        run: python3 test/t3code-appimage-layout-test.py

      - name: Fetch the pinned Omadora source
        run: |
          set -euo pipefail
          revision=$(cat omadora-revision)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none --no-checkout https://github.com/kamm3r/omadora.git "$RUNNER_TEMP/omadora"
          git -C "$RUNNER_TEMP/omadora" checkout --detach "$revision"
          test "$(git -C "$RUNNER_TEMP/omadora" rev-parse HEAD)" = "$revision"
          test "$(git -C "$RUNNER_TEMP/omadora" rev-parse --is-shallow-repository)" = false

      - name: Build and test core RPMs
        env:
          OMADORA_SOURCE: ${{ runner.temp }}/omadora
        run: |
          set -euo pipefail
          # These prerequisites are mandatory here; the local test's skip paths
          # must not turn a missing tool/source into a green CI result.
          command -v rpmbuild
          command -v rpm2cpio
          git -C "$OMADORA_SOURCE" cat-file -e "$(cat omadora-revision)^{commit}"
          bash test/core-packaging-test.sh

  submit-edge:
    name: Submit tested recipes to COPR edge
    needs: fedora
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Install submission tools
        run: dnf -y install git python3 python3-rpm rpm-build
      - name: Check out the tested commit and release history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Submit changed recipe inputs
        env:
          GH_TOKEN: ${{ github.token }}
          COPR_EDGE_WEBHOOK_URL: ${{ secrets.COPR_EDGE_WEBHOOK_URL }}
        run: python3 tools/submit-edge.py
      - name: Record submitted build IDs and input fingerprints
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: copr-edge-submission
          path: edge-submission.json
          if-no-files-found: ignore
          retention-days: 90
